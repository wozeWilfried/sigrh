services:
  - type: web
    name: sigrh-backend
    runtime: java
    plan: free
    rootDir: sigrh-backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/sigrh-0.0.1-SNAPSHOT.jar
    autoDeploy: true
    healthCheckPath: /api-docs
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ORIGINS
        sync: false
      - key: JAVA_VERSION
        value: "21"
