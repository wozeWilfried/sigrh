# =============================================
# PROFIL PRODUCTION (Render / Vercel)
# Base H2 embarquée (gratuite, fichier local)
# =============================================
spring.application.name=sigrh-backend
server.port=${PORT:8080}

# H2 intégré - fichier local, aucun service externe requis
spring.datasource.url=jdbc:h2:file:./data/sigrh;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT
jwt.secret=${JWT_SECRET:sigrh_super_secret_key_2024_minimum_256bits_pour_hs256_algorithm}
jwt.expiration=1800000
jwt.refresh-expiration=604800000

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=${UPLOAD_DIR:uploads/}

# CORS - origine du frontend Vercel + localhost pour dev
app.cors.allowed-origins=${CORS_ORIGINS:https://sigrh-frontend.vercel.app,http://localhost:5173}

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:wilfriedwoze@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:wilfriedwoze@gmail.com}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ML service - optionnel, fallback heuristique si indisponible
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}