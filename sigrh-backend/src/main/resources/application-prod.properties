# =============================================
# PROFIL PRODUCTION (Render / Vercel)
# Base de données : MySQL cloud (Aiven) ou H2 en repli
# =============================================
spring.application.name=sigrh-backend
server.port=${PORT:8080}

# MySQL gratuit (Aiven) - configuré via variables d'environnement Render
# Valeur par défaut : H2 embarqué (repli si aucune variable DB_* n'est définie)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/sigrh;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT
jwt.secret=${JWT_SECRET:sigrh_super_secret_key_2024_minimum_256bits_pour_hs256_algorithm}
jwt.expiration=1800000
jwt.refresh-expiration=604800000

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=${UPLOAD_DIR:uploads/}

# CORS - origine du frontend Vercel + localhost pour dev
app.cors.allowed-origins=${CORS_ORIGINS:https://sigrh-frontend-1hhsjca8l-johntarick51-9571.vercel.app,http://localhost:5173}

# URL du frontend (liens dans les emails)
app.frontend.url=${FRONTEND_URL:https://sigrh-frontend-1hhsjca8l-johntarick51-9571.vercel.app}

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:wilfriedwoze@gmail.com}
spring.mail.password=${MAIL_PASSWORD:rapc dnur urop uqeu}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:wilfriedwoze@gmail.com}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ML service - optionnel, fallback heuristique si indisponible
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}