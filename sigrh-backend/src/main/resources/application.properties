# =============================================
# APPLICATION
# =============================================
spring.application.name=sigrh-backend
server.port=8080

# =============================================
# BASE DE DONNÉES MySQL (WAMP)
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/sigrh_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =============================================
# JWT
# =============================================
jwt.secret=sigrh_super_secret_key_2024_minimum_256bits_pour_hs256_algorithm
jwt.expiration=86400000

# =============================================
# UPLOAD FICHIERS (photos employés)
# =============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=uploads/

# =============================================
# CORS (autorise le frontend React)
# =============================================
app.cors.allowed-origins=http://localhost:5173

# =============================================
# SWAGGER / OPENAPI 3.0
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =============================================
# SERVICE ML (Python FastAPI + XGBoost)
# =============================================
ml.service.url=http://localhost:8000