# =============================================
# APPLICATION
# =============================================
spring.application.name=sigrh-backend
server.port=8080

# =============================================
# BASE DE DONNÉES MYSQL (WAMP)
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/sigrh_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =============================================
# JWT
# =============================================
jwt.secret=sigrh_super_secret_key_2024_minimum_256bits_pour_hs256_algorithm
jwt.expiration=86400000

# =============================================
# UPLOAD FICHIERS (photos employés)
# =============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=uploads/

# =============================================
# CORS (autorise le frontend React)
# =============================================
app.cors.allowed-origins=http://localhost:5173