# =============================================
# APPLICATION
# =============================================
spring.application.name=sigrh-backend
server.port=8080

# =============================================
# BASE DE DONNÉES H2 (EN MÉMOIRE POUR TESTS)
# =============================================
spring.datasource.url=jdbc:h2:mem:sigrh_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================================
# JWT
# =============================================
jwt.secret=sigrh_super_secret_key_2024_minimum_256bits_pour_hs256_algorithm
jwt.expiration=86400000

# =============================================
# UPLOAD FICHIERS (photos employés)
# =============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=uploads/

# =============================================
# CORS (autorise le frontend React)
# =============================================
app.cors.allowed-origins=http://localhost:5173

# =============================================
# SWAGGER / OPENAPI 3.0
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha